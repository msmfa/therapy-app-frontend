appId: com.plastic-brains.app
name: Plastic Brains iOS smoke
tags:
  - smoke
# E2E_EMAIL and E2E_PASSWORD are injected with `-e KEY=value` by
# scripts/e2e/run-ios-sim.sh, which refuses to start without them.
#
# Deliberately no `env:` defaults here. In Maestro 2.8.0 a flow-level `env`
# entry takes precedence over the `-e` value rather than acting as a fallback
# for it, so declaring defaults silently shadows the real credentials: the
# login screen gets the literal placeholder and the run always fails.
---
# The whole journey a first-time user takes on a fresh device, against the
# staging backend, with a dedicated staging account.
#
# Every phase is a separate file so a failure names the phase it happened in.
# The order matters: each phase assumes the app is where the previous one left
# it.
- runFlow: subflows/00-login.yaml
- runFlow: subflows/01-onboarding.yaml
- runFlow: subflows/02-notes.yaml
- runFlow: subflows/03-navigation.yaml
- runFlow: subflows/04-logout.yaml
